eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:mealbridge_matching;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
mealbridge.gateway.internal-auth.enabled=false
mealbridge.gateway.internal-secret=test-internal-secret
mealbridge.notifications.redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
